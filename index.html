<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App Diagnostics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2>Diagnostics</h2>
        </div>
        <div class="sidebar-section">
          <h3>APPLICATIONS</h3>
          <ul id="app-list" class="app-list">
            <li class="loading-text">Loading apps...</li>
          </ul>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <h1 id="current-app-title">Select an Application</h1>
            <span id="current-app-platform" class="badge hidden"></span>
          </div>
          <div class="topbar-right">
            <button id="btn-refresh" class="btn" disabled>🔄 Refresh</button>
            <button id="btn-theme" class="btn">🌓 Theme</button>
          </div>
        </header>

        <div id="dashboard-content" class="dashboard-content hidden">
          <section class="stats-grid">
            <div class="stat-card">
              <span class="stat-label">Total Logs</span>
              <span class="stat-value" id="stat-total">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Errors</span>
              <span class="stat-value" id="stat-errors">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Crashes</span>
              <span class="stat-value" id="stat-crashes">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Affected Sessions</span>
              <span class="stat-value" id="stat-sessions">0</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Affected Devices</span>
              <span class="stat-value" id="stat-devices">0</span>
            </div>
          </section>

          <section class="charts-grid">
            <div class="chart-container">
              <canvas id="chart-timeline"></canvas>
            </div>
            <div class="chart-container">
              <canvas id="chart-versions"></canvas>
            </div>
          </section>

          <section class="toolbar">
            <input type="text" id="search-input" placeholder="Search errors, stack traces, tags..." class="search-input">
            <select id="filter-version" class="filter-select" aria-label="Filter by application version">
              <option value="all">All versions</option>
            </select>
          </section>

          <section class="error-groups">
            <div class="section-header">
              <h3>ERROR GROUPS</h3>
            </div>
            <div id="error-groups-list" class="groups-list">
              </div>
          </section>
        </div>
        
        <div id="loading-overlay" class="loading-overlay hidden">
          <div class="spinner"></div>
          <p>Loading application data...</p>
        </div>
      </main>
    </div>

    <div id="error-detail-view" class="detail-view hidden">
      <header class="detail-header">
        <button id="btn-back" class="btn">← Back</button>
        <div class="detail-title">
          <h2 id="detail-exception">ExceptionType</h2>
          <p id="detail-frame" class="monospace">App.Frame.Location()</p>
          <p id="detail-message">Error message details.</p>
        </div>
        <div class="detail-stats" id="detail-stats-container">
          </div>
      </header>
      <div class="detail-occurrences" id="detail-occurrences-list">
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
